<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Site Under Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F1EEE6;
    --ink:#151310;
    --cobalt:#2E3AF0;
    --mustard:#D9A61A;
    --clay:#B24A2E;
    --card:#FFFDF8;
    --line: rgba(21,19,16,0.14);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--canvas);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }
  .wrap{
    position:relative;
    width:100%; height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .eyebrow{
    position:absolute; top:36px; left:36px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink); opacity:0.55;
  }
  .eyebrow span{color:var(--cobalt); opacity:1;}
  h1{
    position:absolute; top:30px; right:36px;
    font-family:'Fraunces', serif;
    font-weight:600; font-style:italic;
    font-size:20px; margin:0; text-align:right;
    max-width:260px; line-height:1.2;
    opacity:0.8;
  }
  .hint{
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.08em;
    color:var(--ink); opacity:0.45;
    text-transform:uppercase;
  }

  /* --- the literal stack --- */
  .stack{
    position:relative;
    width:260px; height:420px;
  }
  .plate{
    position:absolute;
    left:50%;
    width:200px; height:80px;
    margin-left:-110px;
    border-radius:10px;
    background:var(--card);
    border:1.5px solid var(--line);
    box-shadow: 0 10px 24px rgba(21,19,16,0.10);
    display:flex; align-items:center; gap:14px;
    padding:0 18px;
    cursor:pointer;
    transition: transform .5s cubic-bezier(.22,1,.36,1), box-shadow .3s ease, border-color .3s ease;
    animation: float 6s ease-in-out infinite;
    will-change: transform;
  }
  .plate:nth-child(1){ top:0px;   animation-delay:0s;   }
  .plate:nth-child(2){ top:78px;  animation-delay:.4s;  }
  .plate:nth-child(3){ top:156px; animation-delay:.8s;  }
  .plate:nth-child(4){ top:234px; animation-delay:1.2s; }
  .plate:nth-child(5){ top:312px; animation-delay:1.6s; }

  @keyframes float{
    0%,100%{ transform: translateY(0px) rotate(-0.4deg); }
    50%{ transform: translateY(-7px) rotate(0.4deg); }
  }

  .plate:hover{
    border-color: var(--cobalt);
    box-shadow: 0 14px 30px rgba(46,58,240,0.16);
  }
  .plate.dim{ opacity:0.25; filter:blur(1px); pointer-events:none; }
  .plate.active{
    animation:none;
    z-index:50;
    left:50%; top:50% !important;
    width:380px; height:auto;
    margin-left:-190px;
    transform: translateY(-50%) scale(1);
    flex-direction:column; align-items:flex-start;
    padding:26px 26px 22px;
    border-color:var(--ink);
    box-shadow: 0 30px 60px rgba(21,19,16,0.28);
    cursor:default;
  }

  .icon{
    width:34px; height:34px; flex:none;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:13px;
    color:var(--card);
  }
  .label{
    font-family:'JetBrains Mono', monospace;
    font-weight:500; font-size:14px;
    letter-spacing:0.01em;
  }
  .sub{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; opacity:0.45; margin-left:auto;
  }

  .plate.active .icon{ margin-bottom:14px; }
  .plate.active .label{ font-size:17px; margin-bottom:8px; }
  .plate.active .sub{ display:none; }
  .desc{
    display:none;
    font-family:'Inter', sans-serif;
    font-size:13.5px; line-height:1.5;
    color:var(--ink); opacity:0.8;
    margin:2px 0 16px;
  }
  .plate.active .desc{ display:block; }

  .gh-link{
    display:none;
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.03em;
    color:var(--card);
    background:var(--ink);
    padding:9px 14px; border-radius:6px;
    text-decoration:none;
    align-self:flex-start;
  }
  .gh-link:hover{ background:var(--cobalt); }
  .plate.active .gh-link{ display:inline-block; }

  .close{
    display:none;
    position:absolute; top:14px; right:14px;
    width:24px; height:24px; border-radius:50%;
    border:1px solid var(--line);
    background:transparent;
    font-family:'JetBrains Mono', monospace;
    font-size:13px; line-height:1;
    color:var(--ink); cursor:pointer;
  }
  .plate.active .close{ display:block; }

  .overlay{
    position:fixed; inset:0; background:rgba(241,238,230,0.55);
    backdrop-filter: blur(2px);
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
    z-index:40;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Site Under Construction</span></div>


  <div class="overlay" id="overlay"></div>

  <div class="stack" id="stack">
    <div class="plate" data-color="#2E3AF0" data-name="site under construction" data-desc="Site underway">
      <div class="icon" style="background:#2E3AF0">?</div>
      <div class="label"></div>
      <div class="sub"></div>
      <p class="desc">coming soon::site underway</p>
      <button class="close">✕</button>
    </div>

    </div>

<script>
  const plates = document.querySelectorAll('.plate');
  const overlay = document.getElementById('overlay');

  function closeAll(){
    plates.forEach(p => p.classList.remove('active','dim'));
    overlay.classList.remove('show');
  }

  plates.forEach(p => {
    p.addEventListener('click', (e) => {
      if(p.classList.contains('active')) return;
      plates.forEach(other => {
        if(other === p){ other.classList.add('active'); other.classList.remove('dim'); }
        else { other.classList.add('dim'); other.classList.remove('active'); }
      });
      overlay.classList.add('show');
    });
    p.querySelector('.close').addEventListener('click', (e) => {
      e.stopPropagation();
      closeAll();
    });
    const link = p.querySelector('.gh-link');
    link.addEventListener('click', (e) => e.stopPropagation());
    link.href = p.dataset.repo;
  });

  overlay.addEventListener('click', closeAll);
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeAll(); });
</script>
</body>
</html>
